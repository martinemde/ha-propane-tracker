[project]
name = "ha-propane-tracker"
version = "0.2.0"
description = "Manual propane delivery ledger and Energy statistics for Home Assistant"
authors = [
    { name = "Martin Emde", email = "me@martinemde.com" },
]
requires-python = ">=3.13.2"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.316",
    "ruff==0.15.13",
]
